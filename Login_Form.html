<!DOCTYPE html>
<html>
<head>
    <title>Campus Club Membership</title>
    <style>
        body {
            margin: 0;
            padding-top: 50px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: rgb(255, 0, 0);
        }

        .topnav {
            background-color: #333;
            overflow: hidden;
            position: fixed;   
            top: 0;
            left: 0;
            width: 100%;
        }

        .topnav a {
            float: left;
            color: #f2f2f2;
            text-decoration: none;
            padding: 14px 16px;
            font-size: 14px;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        .card {
            position: relative;   
            width: 400px;
            margin: 20px auto;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: white;
            box-shadow: 4px 4px 8px gray;
        }

        .card > h2 {              
            color: rgb(0, 139, 67);
            margin-top: 0;
        }

        .card p {                
            font-style: italic;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgb(158, 6, 6);
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 4px;
        }

        form {
            width: 400px;
            margin: 25px auto;
        }

        fieldset {
            padding: 12px 15px;
        }

        form label {
            display: inline-block;
            min-width: 110px;
            margin: 5px 0;
            vertical-align: top;
        }

        form label.inline {
            min-width: 0;
            margin-right: 8px;
        }

        textarea {
            display: block;
            width: 95%;
            margin-bottom: 8px;
        }

        button {
            margin-top: 12px;
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a href="home.html">Home</a>
        <a href="events.html">Events</a>
        <a href="join.html">Join</a>
    </div>

    <h1>Programming Club</h1>

    <div class="card">
        <span class="badge">NEW</span>
        <h2>Club Membership</h2>
        <p>Join the Programming Club to take part in contests, workshops and weekly meetups.</p>
    </div>

    <form action="Login_Handler.html" method="post">
        <fieldset>
            <legend>Join the Club</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required minlength="3">
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>

            <label for="stuid">Student ID:</label>
            <input type="text" id="stuid" name="stuid" placeholder="24-56789-1"
                   required pattern="[0-9]{2}-[0-9]{5}-[0-9]" title="Format: 24-56789-1">
            <br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="17" max="40">
            <br>

            <label>Membership Type:</label>
            <input type="radio" id="general" name="memtype" value="general" required>
            <label for="general" class="inline">General</label>
            <input type="radio" id="executive" name="memtype" value="executive" required>
            <label for="executive" class="inline">Executive</label>
            <br>

            <label for="club">Preferred Club:</label>
            <select id="club" name="club" required>
                <option value="">Select a club</option>
                <option value="programming">Programming</option>
                <option value="robotics">Robotics</option>
                <option value="debate">Debate</option>
            </select>
            <br>

            <label for="reason">Why do you want to join?</label>
            <textarea id="reason" name="reason" rows="4" required maxlength="200"></textarea>

            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree" class="inline">I agree to the club rules</label>
            <br>

            <button type="submit">Join Now</button>
        </fieldset>
    </form>
</body>
</html>
